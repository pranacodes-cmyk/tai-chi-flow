name: enso
description: "TaiChi Flow — Tai Chi, Qigong, chair yoga, mindful walking and meditation."
publish_to: 'none'

version: 1.10.5+32

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.8.1
  lucide_icons_flutter: ^4.0.0
  intl: ^0.20.2
  video_player: ^2.14.1
  purchases_flutter: ^9.9.7
  facebook_app_events: ^0.31.0
  app_tracking_transparency: ^2.0.7
  url_launcher: ^6.3.3
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  http: ^1.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/i18n/
    - assets/images/
    - assets/audio/
    - assets/video/
    - assets/voice/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
