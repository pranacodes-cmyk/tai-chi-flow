name: Release to stores

# Manual release: builds the signed Android App Bundle and iOS IPA from the same commit,
# uploads Android to the Play internal track as a draft and iOS to TestFlight.
# Store build numbers come from the run number so every run can be uploaded.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which stores to release to"
        type: choice
        options: [both, android, ios]
        default: both
      play_status:
        description: "Play internal track release status"
        type: choice
        options: [draft, completed]
        default: draft

env:
  FLUTTER_VERSION: "3.47.7"
  PACKAGE_NAME: com.ensoapp.enso

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.bn.outputs.build_number }}
      build_name: ${{ steps.bn.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - id: bn
        name: Store build number
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  android:
    needs: verify
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.verify.outputs.build_name }} \
            --build-number=${{ needs.verify.outputs.build_number }}
      - name: Check upload signature
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "SHA256:" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: taichiflow-aab-${{ needs.verify.outputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status }}
          releaseName: "${{ needs.verify.outputs.build_name }} (${{ needs.verify.outputs.build_number }})"
          whatsNewDirectory: distribution/whatsnew

  ios:
    needs: verify
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install signing certificate and profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          test -n "$P12_B64" || { echo "IOS_DIST_P12_BASE64 secret missing"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          echo "Installed profile $UUID"
      - run: flutter pub get
      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-name=${{ needs.verify.outputs.build_name }} \
            --build-number=${{ needs.verify.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist
          ls -la build/ios/ipa
      - uses: actions/upload-artifact@v4
        with:
          name: taichiflow-ipa-${{ needs.verify.outputs.build_number }}
          path: build/ios/ipa/*.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
