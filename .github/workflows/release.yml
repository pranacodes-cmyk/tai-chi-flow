name: Release to stores

# Manual release: builds the signed Android App Bundle and iOS IPA from the same commit,
# uploads Android to the Play internal track as a draft and iOS to TestFlight.
# Store build numbers come from the run number so every run can be uploaded.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which stores to release to"
        type: choice
        options: [both, android, ios]
        default: both
      play_status:
        description: "Play internal track release status"
        type: choice
        options: [draft, completed]
        default: draft

env:
  FLUTTER_VERSION: "3.47.7"
  PACKAGE_NAME: com.ensoapp.enso

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.bn.outputs.build_number }}
      build_name: ${{ steps.bn.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - id: bn
        name: Store build number
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  android:
    needs: verify
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Move coach voice into an install-time asset pack
        # Play rejects base modules over 200 MB; the voice clips (all languages) ship in a
        # Play asset pack at the same flutter_assets path, so the app loads them unchanged.
        run: |
          DEST=android/voice_pack/src/main/assets/flutter_assets/assets/voice
          mkdir -p "$DEST"
          mv assets/voice/* "$DEST/"
          sed -i '\#^    - assets/voice/$#d' pubspec.yaml
          if grep -q 'assets/voice/' pubspec.yaml; then echo 'voice still listed'; exit 1; fi
          echo "Voice clips in pack: $(ls "$DEST" | wc -l)"
      - run: flutter pub get
      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.verify.outputs.build_name }} \
            --build-number=${{ needs.verify.outputs.build_number }}
      - name: Check bundle layout and size
        run: |
          python3 - <<'EOF'
          import zipfile, sys
          z = zipfile.ZipFile("build/app/outputs/bundle/release/app-release.aab")
          names = z.infolist()
          pack = [i for i in names if i.filename.startswith("voice_pack/assets/flutter_assets/assets/voice/")]
          base_voice = [i for i in names if i.filename.startswith("base/assets/flutter_assets/assets/voice/")]
          base = sum(i.compress_size for i in names if i.filename.startswith("base/"))
          packed = sum(i.compress_size for i in pack)
          print(f"voice clips in asset pack: {len(pack)} ({packed/1e6:.1f} MB)")
          print(f"voice clips left in base: {len(base_voice)}")
          print(f"base module compressed: {base/1e6:.1f} MB")
          # Lesson voice lives on R2 and only English onboarding/UI/breath cues stay in the pack.
          if len(pack) < 60 or base_voice or base > 190e6:
              sys.exit("bundle layout check failed")
          EOF
      - name: Check upload signature
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "SHA256:" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: taichiflow-aab-${{ needs.verify.outputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status }}
          releaseName: "${{ needs.verify.outputs.build_name }} (${{ needs.verify.outputs.build_number }})"
          whatsNewDirectory: distribution/whatsnew

  ios:
    needs: verify
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install development identity and App Store Connect key
        env:
          P12_B64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # The archive is signed with our own development identity; the App Store export is signed
          # by Apple's cloud-managed distribution certificate through the API key, so no shared
          # distribution certificate (which other pipelines on this team rotate) is needed.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/dev.p12"
            security import "$RUNNER_TEMP/dev.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Prepare Xcode project
        run: |
          flutter build ios --release --config-only \
            --build-name=${{ needs.verify.outputs.build_name }} \
            --build-number=${{ needs.verify.outputs.build_number }}
          cd ios && pod install
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 60
      - name: Fix and verify privacy manifests (ITMS-91064)
        run: |
          set -euo pipefail
          # App Store Connect rejects any privacy manifest whose tracking flag disagrees with its
          # tracking-domain list. SDK manifests with domains get tracking=true; then every manifest
          # is checked both ways and the build fails before upload if any mismatch remains.
          python3 - "$RUNNER_TEMP/Runner.xcarchive" <<'PY'
          import plistlib, glob, sys
          bad = 0
          for f in glob.glob(sys.argv[1] + '/**/*.xcprivacy', recursive=True):
              d = plistlib.load(open(f, 'rb'))
              domains = d.get('NSPrivacyTrackingDomains') or []
              tracking = bool(d.get('NSPrivacyTracking'))
              if domains and not tracking:
                  d['NSPrivacyTracking'] = True
                  plistlib.dump(d, open(f, 'wb'), fmt=plistlib.FMT_XML)
                  print('patched tracking=true:', f)
                  tracking = True
              ok = tracking == bool(domains)
              print('OK ' if ok else 'BAD', tracking, domains, f.split('.app/')[-1])
              bad |= not ok
          sys.exit(1 if bad else 0)
          PY
      - name: Export IPA (cloud-signed for App Store)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
          ls -la build/ios/ipa
      - uses: actions/upload-artifact@v4
        with:
          name: taichiflow-ipa-${{ needs.verify.outputs.build_number }}
          path: build/ios/ipa/*.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
